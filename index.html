<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренажёр: виды придаточных предложений</title>
<style>
:root{--bg:#f7f2ec;--card:#fff;--tx:#2a211b;--ac:#9a4a1f;--bd:#e0d4c6;--ok:#2f6f45;--okbg:#e5f1e8;--bad:#a7321f;--badbg:#f8e4df;--ac-tx:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1814;--card:#2a221c;--tx:#f0e8df;--ac:#e0a074;--bd:#4a3d33;--ok:#8fd1a2;--okbg:#25382c;--bad:#f0a090;--badbg:#42251f;--ac-tx:#1e1814}}
:root[data-theme="dark"]{--bg:#1e1814;--card:#2a221c;--tx:#f0e8df;--ac:#e0a074;--bd:#4a3d33;--ok:#8fd1a2;--okbg:#25382c;--bad:#f0a090;--badbg:#42251f;--ac-tx:#1e1814}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.55 Georgia,"Times New Roman",serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;margin:.2em 0 .1em;color:var(--ac)}
.sub{opacity:.75;margin:0 0 16px;font-size:.95rem}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button,.btn{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 16px}
.tabs button.on,.btn.main{background:var(--ac);color:var(--ac-tx);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:12px}
.card h3{margin:0 0 6px;color:var(--ac);font-size:1.1rem}
.card p{margin:.3em 0}
.lbl{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;opacity:.65}
.ex{border-left:3px solid var(--bd);padding-left:10px;margin:.4em 0;font-style:italic}
mark{background:none;color:var(--ac);font-weight:bold;text-decoration:underline;text-underline-offset:3px}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:.92rem;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.prog{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.sent{position:relative}
.sent.show{line-height:2.5;padding-bottom:30px}
.sent.show .kw{font-weight:bold;border-bottom:2px dashed var(--ac)}
.sent{font-size:1.25rem;margin:6px 0 14px}
.opts{display:grid;grid-template-columns:1fr;gap:8px}
.opts button{font:inherit;font-size:.95rem;cursor:pointer;text-align:left;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:9px 12px}
.opts button:hover:not(:disabled){border-color:var(--ac)}
.opts button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opts button.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.opts button:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:.95rem}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--badbg)}
.hide{display:none}
.res{text-align:center}
.cj{background:var(--ac);color:var(--ac-tx);padding:0 4px;border-radius:4px;text-decoration:none}
.grp{font-size:1.05rem;color:var(--ac);margin:18px 0 8px}
.res .big{font-size:2.4rem;color:var(--ac);margin:.1em 0}
.fopt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--bg);cursor:pointer}
.fopt input{margin-top:.5em;width:18px;height:18px;accent-color:var(--ac);flex:none}
.fopt.ok{background:var(--okbg);border-color:var(--ok)}
.fopt.no{background:var(--badbg);border-color:var(--bad)}
.fopt.miss{border:2px dashed var(--ok)}
.fopt .tp{display:block;font-size:.85rem;opacity:.85;margin-top:4px}
.err{font-size:.92rem;margin:6px 0;padding-left:10px;border-left:3px solid var(--bad)}
</style>
</head>
<body>
<div class="wrap">
<h1>Виды придаточных предложений</h1>
<p class="sub">Сначала определи тип придаточного, а если оно обстоятельственное — выбери его вид. Опирайся на вопрос от главного предложения.</p>
<div class="tabs"><button id="tT" class="on">Теория</button><button id="tP">Определи вид</button><button id="tF">Найди вид</button></div>
<div id="theory"></div>
<div id="train" class="hide"></div>
<div id="find" class="hide"></div>
</div>
<script>
const G={opr:"Определительное",izy:"Изъяснительное",obst:"Обстоятельственное"};
// n — название, g — группа, l — связь с главным, q — вопрос, i — указательное слово, c — союзы, w — союзные слова
const T=[
{k:"opr",g:"opr",n:"Определительное",l:"существительное или местоимение",q:"какой?",i:"такой, тот",c:"—",w:"который, какой, чей, когда, где, куда, откуда, что",e:"Виднелся пруд, [[{{который}} зарос осокой]]. Подошли к тому пруду, [[{{где}} плавали утки]]."},
{k:"izy",g:"izy",n:"Изъяснительное",l:"глагол, наречие, существительное со значением речи, мысли, чувства",q:"падежные вопросы (о чём? что? чему?)",i:"то",c:"что, чтобы, как, будто, как будто; ли — частица в роли союза",w:"что, кто, как, какой, чему, где, куда, откуда, насколько",e:"Газета написана о том, [[{{что}} будет дождь]]. Учитель объяснил, [[{{как}} сделать задание]]."},
{k:"obraz",g:"obst",n:"Образа действия",l:"наречие «так»",q:"как? каким образом?",i:"так",c:"—",w:"как",e:"Выполнили задание так, [[{{как}} я показал]]."},
{k:"mera",g:"obst",n:"Меры и степени",l:"местоимение или наречие: так, такой, настолько, (не)столько",q:"в какой мере? в какой степени?",i:"так, такой, настолько, (не)столько",c:"что, чтобы + сравнительные союзы",w:"насколько, сколько",e:"Музыка Баха так прекрасна, [[{{что}} люди испытывают восторг]]."},
{k:"vrem",g:"obst",n:"Времени",l:"вся главная часть; наречия (вечером, зимой)",q:"когда? как долго? с каких пор? до каких пор?",i:"тогда",c:"когда, пока, как; только, едва, лишь, чуть — частицы в роли союза",w:"когда (если в главной части есть «тогда» или наречие со значением времени)",e:"Лишь тогда, [[{{когда}} спустилась ночь]], стал виден Млечный Путь."},
{k:"mesto",g:"obst",n:"Места",l:"вся главная часть; наречия (вдали, сзади)",q:"где? куда? откуда?",i:"там, туда, оттуда",c:"—",w:"где, куда, откуда",e:"Он был там, [[{{где}} никто ещё не был]]. Иди, [[{{куда}} влечёт тебя свободный ум]]."},
{k:"prich",g:"obst",n:"Причины",l:"вся главная часть",q:"почему? отчего?",i:"—",c:"потому что, оттого что, так как",w:"—",e:"Спросить было некого, [[{{так как}} все уехали в степь]]."},
{k:"sled",g:"obst",n:"Следствия",l:"вся главная часть",q:"каково следствие?",i:"—",c:"так что",w:"—",e:"Ливни размыли дорогу, [[{{так что}} в город не проехать]]."},
{k:"usl",g:"obst",n:"Условия",l:"вся главная часть",q:"при каком условии?",i:"—",c:"если (…, то / так / тогда), раз",w:"—",e:"[[{{Если}} лес берёзовый]], то под ним растут трава, цветы."},
{k:"cel",g:"obst",n:"Цели",l:"вся главная часть",q:"зачем? с какой целью?",i:"затем",c:"чтобы; лишь бы, только бы, лишь бы только",w:"—",e:"Пришёл затем, [[{{чтобы}} взять книгу]]. Готов отдать всё, [[{{лишь бы}} спасти сына]]."},
{k:"ust",g:"obst",n:"Уступки",l:"вся главная часть",q:"вопреки чему?",i:"—",c:"хотя (хоть), несмотря на то что, пусть, пускай",w:"что, кто, какой, как, сколько, где, куда + (бы) ни",e:"[[{{Как ни}} занимался]], успеха нет. Поставили парус, [[{{хотя}} почти не было ветра]]."},
{k:"sravn",g:"obst",n:"Сравнения",l:"вся главная часть",q:"как что? подобно чему?",i:"так",c:"как, будто, словно, точно, так же как, как бывает",w:"—",e:"Звёзды сияют, [[{{словно}} их вымыли]]. Было так тихо, [[{{как}} бывает только в осеннем лесу]]."},
{k:"prisoed",g:"obst",n:"Присоединительное",l:"вся главная часть",q:"вопрос поставить нельзя",i:"—",c:"—",w:"что (во всех падежах), отчего, почему, зачем",e:"Вечером выпала роса, [[{{что}} обещало назавтра хорошую погоду]]."}
];
const Q=[
["opr","Я увидел <<дом>>, [[{{где}} прошло моё детство]].","«Какой дом?» — союзное слово «где», относится к существительному.","какой?"],
["opr","Я увидел <<дом>>, [[{{куда}} всегда хотел вернуться]].","«Какой дом?» — союзное слово «куда» при существительном.","какой?"],
["opr","За окном росло <<дерево>>, [[ветви {{которого}} закрывали солнце всем жителям дома]].","«Какое дерево?» — «ветви которого»; заменяет определение «ветвистое».","какое?"],
["opr","Виднелся <<пруд>>, [[{{который}} зарос осокой]].","«Какой пруд?» — союзное слово «который».","какой?"],
["opr","Подошли к тому <<пруду>>, [[{{где}} плавали утки]].","«К какому пруду?» — указательное слово «тому», вопрос от существительного.","к какому?"],
["opr","Я подошёл к тому <<месту>>, [[{{откуда}} доносился голос]].","«К какому месту?» — вопрос от существительного, значит, определительное, хотя слово «откуда».","к какому?"],
["opr","Отставной втируша-регент сидел на том самом <<месте>>, [[{{где}} сидел ещё недавно сам Иван Николаевич]].","«На каком месте?» — вопрос от существительного, указательное слово «том», союзное слово «где».","на каком?"],
["opr","Грохот золотых тарелок в джазе иногда покрывал грохот <<посуды>>, [[{{которую}} судомойки по наклонной плоскости спускали в кухню]].","«Посуды (какой?)» — вопрос от существительного, союзное слово «которую».","какой?"],
["opr","Тут у самого выхода на Бронную со скамейки навстречу редактору поднялся в точности тот самый <<гражданин>>, [[{{что}} тогда при свете солнца вылепился из жирного зноя]].","«Гражданин (какой?)» — указательные слова «тот самый», союзное слово «что».","какой?"],
["opr","И на всём его трудном пути невыразимо почему-то мучил вездесущий <<оркестр>>, [[под аккомпанемент {{которого}} тяжёлый бас пел о своей любви к Татьяне]].","«Оркестр (какой?)» — союзное слово «которого» в составе «под аккомпанемент которого».","какой?"],
["opr","Выехав на упомянутое <<заседание>>, [[{{каковое}}, к слову говоря, и назначено-то вчера не было]], Аркадий Аполлонович отпустил своего шофёра у здания акустической комиссии на Чистых прудах…","«Заседание (какое?)» — союзное слово «каковое» (устар. = «которое»), придаточное вставлено внутрь главной части.","какое?"],
["opr","Он был бос, в разодранной беловатой <<толстовке>>, [[к {{коей}} на груди английской булавкой была приколота бумажная иконка со стершимся изображением неизвестного святого]], и в полосатых белых кальсонах.","«В толстовке (какой?)» — союзное слово «коей» (устар. = «которой»).","в какой?"],
["opr","В пыли пролетали, бряцая цепями, <<грузовики>>, [[на платформах {{коих}}, на мешках, раскинувшись животами кверху, лежали какие-то мужчины]].","«Грузовики (какие?)» — союзное слово «коих» (устар. = «которых»).","какие?"],
["opr","Теперь регент нацепил себе на нос явно не нужное <<пенсне>>, [[в {{котором}} одного стекла вовсе не было, а другое треснуло]].","«Пенсне (какое?)» — союзное слово «котором».","какое?"],
["izy","Я не <<знаю>>, [[был {{ли}} этот дом продан]].","Не знаю (о чём?) — вопрос косвенного падежа, «ли» — частица в роли союза.","о чём?"],
["izy","Я не <<удивляюсь>> тому, [[{{что}} дом продан]].","Не удивляюсь (чему?) — падежный вопрос, указательное слово «тому».","чему?"],
["izy","Я <<продам>> дом тому, [[{{кто}} даст большую цену]].","Продам (кому?) — падежный вопрос, союзное слово «кто».","кому?"],
["izy","Газета <<написана>> о том, [[{{что}} будет дождь]].","Написана (о чём?) — падежный вопрос, указательное слово «то».","о чём?"],
["izy","Учитель <<объяснил>>, [[{{как}} сделать задание]].","Объяснил (что?) — падежный вопрос, слово речи в главной части.","что?"],
["izy","Я не <<знаю>>, [[{{что}} было в этом доме]].","Не знаю (что?) — падежный вопрос.","что?"],
["izy","Ни какая это была дама, ни который сейчас час, ни какое число, ни какого месяца – Степа решительно не знал и, что хуже всего, не мог <<понять>>, [[{{где}} он находится]].","Не мог понять (что?) — падежный вопрос, союзное слово «где». Такие же изъяснительные части стоят при «не знал»: «какая это была дама», «который сейчас час» и т. д.","что?"],
["izy","Каифа прямо в глаза посмотрел Пилату и <<сказал>> тихим, но твёрдым голосом, [[{{что}} Синедрион внимательно ознакомился с делом и вторично сообщает, что намерен освободить Вар-раввана]].","Сказал (что?) — падежный вопрос, союз «что». Внутри есть вторая изъяснительная часть: «сообщает (что?), что намерен освободить Вар-раввана».","что?"],
["izy","Ему прокурор приказал сдать преступника начальнику тайной службы и при этом передать ему <<распоряжение>> прокуратора о том, [[{{чтобы}} Иешуа Га-Ноцри был отделен от других осужденных]], а также о том, чтобы команде тайной службы было под страхом тяжкой кары запрещено о чем бы то ни было разговаривать с Иешуа или отвечать на какие-либо его вопросы.","Распоряжение (о чём?) — вопрос косвенного падежа, указательное слово «о том», союз «чтобы». Вторая изъяснительная часть («о том, чтобы команде…») однородна первой.","о чём?"],
["izy","Пилат <<сказал>>, [[{{что}} он разобрал дело Иешуа Га-Ноцри и утвердил смертный приговор]].","Сказал (что?) — падежный вопрос, союз «что».","что?"],
["izy","Итак, прокуратор желает <<знать>>, [[{{кого}} из двух преступников намерен освободить Синедрион]]…","Желает знать (что?) — падежный вопрос, союзное слово «кого».","что?"],
["izy","Его прокуратор <<спросил>> о том, [[{{где}} сейчас находится себастийская когорта]].","Спросил (о чём?) — вопрос косвенного падежа, указательное слово «о том», союзное слово «где».","о чём?"],
["izy","Но Маргарита не могла <<сказать>>, [[был {{ли}} это грохот падения или грохот сатанинского смеха]].","Не могла сказать (что?) — падежный вопрос, «ли» — частица в роли союза.","что?"],
["izy","<<Увидев>>, [[{{в каком}} состоянии Степан Богданович]], артист послал Груню в ближайший гастроном за водкой и закуской, в аптеку за льдом…","Увидев (что?) — падежный вопрос, союзное слово «в каком».","что?"],
["izy","Иван устремился за злодеями вслед и тотчас <<убедился>>, [[{{что}} догнать их будет очень трудно]].","Убедился (в чём?) — вопрос косвенного падежа, союз «что».","в чём?"],
["izy","Все это <<зависит>> от того, [[с {{какой}} точки зрения смотреть на предмет]], все это, Никанор Иванович, условно и зыбко.","Зависит (от чего?) — вопрос косвенного падежа, указательное слово «от того», союзное слово «какой».","от чего?"],
["izy","Кто-то суетился, <<кричал>>, [[{{что}} необходимо сейчас же, тут же, не сходя с места, составить какую-то коллективную телеграмму и немедленно послать ее]].","Кричал (что?) — падежный вопрос, слово речи в главной части, союз «что».","что?"],
["izy","Степа, тараща глаза, <<увидел>>, [[{{что}} на маленьком столике сервирован поднос, на коем имеется нарезанный белый хлеб, паюсная икра в вазочке, белые маринованные грибы на тарелочке, что-то в кастрюльке и, наконец, водка в объемистом ювелиршином графинчике]].","Увидел (что?) — падежный вопрос, союз «что». Внутри есть определительная часть: «поднос (какой?), на коем имеется…».","что?"],
["sled","Он с размаху <<шлепнул>> Маргариту по спине, [[{{так что}} по ее телу прошел звон]].","Каково следствие? — союз «так что», придаточное после главной части.","каково следствие?"],
["mera","…На верхней площадке грохнула дверь, кто-то покатился вниз по лестнице и, налетев на Аннушку, отбросил ее в сторону <<так>>, [[{{что}} она ударилась затылком об стену]].","В какой степени? — опорное слово «так», союз «что».","в какой степени?"],
["mera","Степан Богданович так <<крепко>> спит, [[{{что}} разбудить его она не берется]].","В какой степени? — опорное слово «так», союз «что».","в какой степени?"],
["opr","Во втором кресле сидел тот самый <<тип>>, [[{{что}} померещился в передней]].","«Какой тип?» — указательные слова «тот самый», союзное слово «что».","какой?"],
["izy","<<Вспомни>>, [[{{как}} мне пришлось из-за вас снимать со стен щиты с вензелями императора, перемещать войска]]…","Вспомни (что?) — падежный вопрос, союз «как».","что?"],
["izy","Становилось <<ясным>>, [[{{что}} посещение дома скорби оставило в нем тяжелейший след]].","Становилось ясным (что?) — вопрос косвенного падежа, союз «что».","что?"],

["izy","<<Припомнилось>> даже, [[{{как}} нанимали этот таксомотор у «Метрополя»]]","Припомнилось (что?) — падежный вопрос, союз «как».","что?"],

["obraz","Я делал всё таким <<образом>>, [[{{чтобы}} не вызвать подозрений]].","Каким образом? — опорные слова «таким образом».","каким образом?"],
["usl","[[{{Кабы}} знал об этом]], обязательно <<приехал>> бы раньше.","При каком условии? — союз «кабы».","при каком условии?"],

["cel","Готов <<отдать>> всё, [[{{лишь бы}} спасти сына]].","С какой целью? — союз «лишь бы».","с какой целью?"],
["prisoed","Вечером <<выпала>> роса, [[{{что}} обещало назавтра хорошую погоду]].","Вопрос не задать: добавочное сообщение, «что» = «и это».","вопрос поставить нельзя"],
["prisoed","На работе у меня <<случился>> аврал, [[{{почему}} и пришлось прервать отпуск]].","Вопрос не задать: добавочное сообщение, союзное слово «почему».","вопрос поставить нельзя"],

const N=Object.fromEntries(T.map(t=>[t.k,t.n]));
const GK=k=>T.find(t=>t.k==k).g;
const fmt=s=>s.replace(/\[\[(.+?)\]\]/g,"<mark>$1</mark>").replace(/\{\{(.+?)\}\}/g,"<span class=\"cj\">$1</span>").replace(/<<(.+?)>>/g,"<span class=\"kw\">$1</span>").replace(/\[|\]/g,"");
const $=id=>document.getElementById(id);
const OB=T.filter(t=>t.g=="obst").sort((a,b)=>a.n.localeCompare(b.n,"ru"));
const row=(a,b)=>b&&b!="—"?`<p><span class="lbl">${a}</span><br>${b}</p>`:"";
const card=t=>`<div class="card"><h3>${t.n}</h3>${row("Связь с главным",t.l)}${row("Вопрос от главного к придаточному",t.q)}${row("Указательное слово в главном",t.i)}${row("Подчинительные союзы",t.c)}${row("Союзные слова",t.w)}<div class="ex">${fmt(t.e)}</div></div>`;
$("theory").innerHTML=card(T[0])+card(T[1])+`<div class="grp">Обстоятельственные придаточные</div>`+OB.map(card).join("");
function show(w){$("theory").classList.toggle("hide",w!="T");$("train").classList.toggle("hide",w!="P");$("find").classList.toggle("hide",w!="F");$("tT").classList.toggle("on",w=="T");$("tP").classList.toggle("on",w=="P");$("tF").classList.toggle("on",w=="F");if(w=="P"&&!st)start();if(w=="F"&&!fs)startF()}
$("tT").onclick=()=>show("T");$("tP").onclick=()=>show("P");$("tF").onclick=()=>show("F");
let st=null;
function start(){
  const items=Q.map(q=>({k:q[0],s:q[1],h:q[2],q:q[3]})).sort(()=>Math.random()-.5).slice(0,15);
  st={items,i:0,ok:0,miss:[]};render();
}
let fs=null;
const lab=k=>{const g=GK(k);return g=="obst"?"обстоятельственное, "+N[k].toLowerCase():G[g].toLowerCase()};
function startF(){
  const keys=T.map(t=>t.k).sort(()=>Math.random()-.5).slice(0,3);
  const steps=keys.map(k=>{
    const pool=Q.filter(q=>q[0]==k).map(q=>({k,s:q[1]})).sort(()=>Math.random()-.5);
    const n=Math.min(1+Math.floor(Math.random()*2),pool.length);
    const others=Q.filter(q=>q[0]!=k).map(q=>({k:q[0],s:q[1]})).sort(()=>Math.random()-.5).slice(0,3-n);
    return {t:k,opts:pool.slice(0,n).concat(others).sort(()=>Math.random()-.5)};
  });
  fs={steps,i:0,ok:0,done:false};renderF();
}
function renderF(){
  const r=$("find");
  if(fs.i>=fs.steps.length){
    r.innerHTML=`<div class="card res"><div class="lbl">Результат</div><div class="big">${fs.ok} из ${fs.steps.length}</div><p>${fs.ok==fs.steps.length?"Отлично!":"Загляни в теорию и попробуй ещё раз."}</p></div><button class="btn main" id="againF">Ещё раунд</button>`;
    $("againF").onclick=startF;return;
  }
  const t=fs.steps[fs.i];fs.done=false;
  r.innerHTML=`<div class="bar"><span>Шаг ${fs.i+1} из ${fs.steps.length}</span><span>Верно: ${fs.ok}</span></div><div class="prog"><i style="width:${fs.i/fs.steps.length*100}%"></i></div>
  <div class="card"><div class="lbl">Задание</div><p style="font-size:1.1rem">Отметь предложения, в которых придаточное — <b>${lab(t.t)}</b>. Подходящих может быть одно или два.</p>
  ${t.opts.map((o,j)=>`<label class="fopt" id="fo${j}"><input type="checkbox" id="fc${j}"><span>${fmt(o.s)}<span class="tp hide" id="ft${j}"></span></span></label>`).join("")}
  <div id="ffb"></div><p><button class="btn main" id="fchk">Проверить</button></p></div>`;
  $("fchk").onclick=checkF;
}
function checkF(){
  if(fs.done){fs.i++;renderF();return}
  const t=fs.steps[fs.i];let all=true;
  t.opts.forEach((o,j)=>{
    const sel=$("fc"+j).checked,right=o.k==t.t,el=$("fo"+j);
    $("fc"+j).disabled=true;
    if(sel!=right)all=false;
    el.classList.add(sel&&right?"ok":sel?"no":right?"miss":"x");
    const tp=$("ft"+j);tp.classList.remove("hide");tp.textContent="Придаточное: "+lab(o.k)+(!sel&&right?" — это предложение нужно было отметить":"");
  });
  if(all)fs.ok++;
  fs.done=true;
  $("ffb").innerHTML=`<div class="fb ${all?"ok":"no"}"><b>${all?"Верно!":"Не совсем."}</b> Под каждым предложением указан вид его придаточной части.</div>`;
  $("fchk").textContent=fs.i+1<fs.steps.length?"Дальше":"Результат";
}
let cur=null;
function arrow(it){
  cur=it;const box=$("sent");if(!box)return;box.classList.add("show");
  const old=$("arr");if(old)old.remove();
  const kw=box.querySelector(".kw"),cl=box.querySelector("mark");if(!kw||!cl)return;
  const b=box.getBoundingClientRect(),r1=kw.getClientRects()[0],r2=cl.getClientRects()[0];
  const x1=r1.left+r1.width/2-b.left,y1=r1.bottom-b.top+2,x2=r2.left+Math.min(r2.width/2,30)-b.left,y2=r2.bottom-b.top+2;
  const dip=Math.max(y1,y2)+24,my=(y1+y2+6*dip)/8;
  box.insertAdjacentHTML("beforeend",`<svg id="arr" width="${b.width}" height="${b.height}" style="position:absolute;left:0;top:0;pointer-events:none;overflow:visible"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--ac)"/></marker></defs><path d="M${x1} ${y1} C${x1} ${dip} ${x2} ${dip} ${x2} ${y2}" fill="none" stroke="var(--ac)" stroke-width="2" marker-end="url(#ah)"/><text x="${(x1+x2)/2}" y="${my+17}" text-anchor="middle" font-size="15" font-weight="bold" fill="var(--ac)" style="paint-order:stroke;stroke:var(--card);stroke-width:5px">${it.q}</text></svg>`);
}
window.addEventListener("resize",()=>{const bx=$("sent");if(cur&&bx&&bx.classList.contains("show"))arrow(cur)});
function render(){
  const r=$("train");
  if(st.i>=st.items.length){
    const p=Math.round(st.ok/st.items.length*100);
    r.innerHTML=`<div class="card res"><div class="lbl">Результат</div><div class="big">${st.ok} из ${st.items.length}</div><p>${p>=85?"Отлично!":p>=60?"Хорошо, но есть над чем поработать.":"Загляни в теорию и попробуй ещё раз."}</p></div>`+
    (st.miss.length?`<div class="card"><h3>Разбор ошибок</h3>${st.miss.map(m=>`<div class="err">${fmt(m.s)}<br><b>${G[GK(m.k)]}${GK(m.k)=="obst"?" — "+N[m.k].toLowerCase():""}</b> — ${m.h}</div>`).join("")}</div>`:"")+
    `<button class="btn main" id="again">Ещё раунд</button>`;
    $("again").onclick=start;return;
  }
  const it=st.items[st.i];
  r.innerHTML=`<div class="bar"><span>Вопрос ${st.i+1} из ${st.items.length}</span><span>Верно: ${st.ok}</span></div><div class="prog"><i style="width:${st.i/st.items.length*100}%"></i></div>
  <div class="card"><div class="lbl">Какое это придаточное?</div><div class="sent" id="sent">${fmt(it.s)}</div><p id="hlp"><button class="btn" id="hb">Затрудняюсь подобрать вопрос</button></p>
  <div class="opts" id="opts">${Object.keys(G).map(k=>`<button data-k="${k}">${G[k]}</button>`).join("")}</div>
  <div id="fb"></div></div>`;
  document.querySelectorAll("#opts button").forEach(b=>b.onclick=()=>step1(b,it));
  $("hb").onclick=()=>arrow(it);
}
function mark(sel,right,wrong){document.querySelectorAll(sel+" button").forEach(x=>{x.disabled=true;if(x.dataset.k==right)x.classList.add("ok")});if(wrong)wrong.classList.add("no")}
function step1(b,it){
  const g=GK(it.k),good=b.dataset.k==g;
  mark("#opts",g,good?null:b);
  if(!good)return finish(it,false);
  if(g!="obst")return finish(it,true);
  $("fb").innerHTML=`<div class="fb ok"><b>Верно: обстоятельственное.</b> Теперь выбери вид.</div><div class="lbl" style="margin:12px 0 6px">Вид обстоятельственного</div><div class="opts" id="opts2">${OB.map(t=>`<button data-k="${t.k}">${t.n}</button>`).join("")}</div><div id="fb2"></div>`;
  document.querySelectorAll("#opts2 button").forEach(x=>x.onclick=()=>{const good2=x.dataset.k==it.k;mark("#opts2",it.k,good2?null:x);finish(it,good2,"fb2")});
}
function finish(it,good,id="fb"){
  const hp=$("hlp");if(hp)hp.remove();
  if(good)st.ok++;else st.miss.push(it);
  const g=GK(it.k),full=G[g]+(g=="obst"?" ("+N[it.k].toLowerCase()+")":"");
  const nxt=`<p><button class="btn main" id="nx">${st.i+1<st.items.length?"Дальше":"Результат"}</button></p>`;
  $(id).innerHTML=`<div class="fb ${good?"ok":"no"}"><b>${good?"Верно!":"Не совсем. Правильный ответ: "+full+"."}</b><br>${it.h}</div>`+nxt;
  $("nx").onclick=()=>{st.i++;render()};
}
</script>
